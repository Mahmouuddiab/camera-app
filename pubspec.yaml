name: flutter_camera_app
description: "flutter camera app — recording, filters & effects."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  image: ^4.1.7
  camera: ^0.10.5+9
  video_player: ^2.8.6
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  gal: ^2.3.0          # save recorded video into device gallery
  wakelock_plus: ^1.2.5 # keep screen on while recording

  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
